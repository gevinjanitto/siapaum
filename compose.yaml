name: siajaib-reborn

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-siapaum_reborn}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-siapaum}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-siapaum}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./:/var/www/html
      - composer_vendor:/var/www/html/vendor
      - laravel_storage:/var/www/html/storage
      - laravel_cache:/var/www/html/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - laravel_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      APP_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    restart: unless-stopped

  database:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-siapaum_reborn}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-siapaum}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-siapaum}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  composer_vendor:
  laravel_cache:
  laravel_storage:
  mysql_data:
  node_modules:
